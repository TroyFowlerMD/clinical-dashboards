<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JFK Detox Protocols — JFK ADATC</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    /* Page-specific styles for protocols */

    /* Search match count badge */
    .search-count {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }
    .search-count.has-results {
      color: var(--teal);
    }

    /* Section divider */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: var(--space-8) 0;
    }

    /* Hold banner — universal hold parameters */
    .hold-banner .hold-title {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      margin-bottom: var(--space-2);
      color: var(--red);
    }

    .hold-banner .hold-params {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      font-size: var(--text-xs);
    }

    .hold-banner .hold-param {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      background-color: rgba(248, 113, 113, 0.08);
      border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-2);
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
    }

    [data-theme="light"] .hold-banner .hold-param {
      background-color: rgba(220, 38, 38, 0.06);
    }

    /* Protocol indication tag */
    .indication-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--text-xs);
      color: var(--teal);
      background-color: var(--teal-bg);
      border: 1px solid var(--teal-border);
      border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-2);
      margin-bottom: var(--space-3);
      font-weight: 500;
    }

    /* PRN box bullet list */
    .prn-box ul {
      list-style: none;
      padding: 0;
      margin: var(--space-2) 0 0 0;
    }

    .prn-box ul li {
      position: relative;
      padding-left: var(--space-4);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-1);
      max-width: none;
    }

    .prn-box ul li::before {
      content: "";
      position: absolute;
      left: var(--space-2);
      top: 0.65em;
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
      background-color: var(--amber);
      opacity: 0.6;
    }

    /* Taper table label */
    .taper-label {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }

    /* Protocol note */
    .protocol-note {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: var(--space-3);
      padding-left: var(--space-3);
      border-left: 2px solid var(--border);
    }

    /* Scheduled dose box */
    .scheduled-box {
      background-color: var(--teal-bg);
      border: 1px solid var(--teal-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
    }

    .scheduled-box .scheduled-label {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--teal);
      margin-bottom: var(--space-1);
    }

    .scheduled-box .scheduled-drug {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .scheduled-box .scheduled-details {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Warning banner content styling */
    .warning-banner .warning-title {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      margin-bottom: var(--space-2);
      color: var(--amber);
    }

    .warning-banner ol {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: warning-step;
    }

    .warning-banner ol li {
      position: relative;
      padding-left: var(--space-6);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-2);
      max-width: none;
      counter-increment: warning-step;
    }

    .warning-banner ol li::before {
      content: counter(warning-step, lower-alpha) ".";
      position: absolute;
      left: var(--space-2);
      font-weight: 600;
      color: var(--amber);
    }

    /* Table scroll wrapper for mobile */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Feedback box */
    .feedback-box { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); margin-top: var(--space-10); }
    .feedback-box h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--text); margin-bottom: var(--space-4); }
    .feedback-form { display: flex; flex-direction: column; gap: var(--space-4); }
    .feedback-field { display: flex; flex-direction: column; gap: var(--space-2); }
    .feedback-field label { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; color: var(--text); }
    .feedback-field input, .feedback-field textarea { background-color: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); color: var(--text); font-family: var(--font-body); transition: border-color var(--duration) var(--ease-out), box-shadow var(--duration) var(--ease-out); resize: vertical; }
    .feedback-field input::placeholder, .feedback-field textarea::placeholder { color: var(--text-muted); }
    .feedback-field input:focus, .feedback-field textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-bg); }
    .feedback-field textarea { min-height: 100px; }
    .feedback-submit { display: inline-flex; align-items: center; gap: var(--space-2); background-color: var(--teal); color: var(--bg); font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; padding: var(--space-2) var(--space-5); border-radius: var(--radius-md); border: none; cursor: pointer; align-self: flex-start; transition: background-color var(--duration) var(--ease-out), opacity var(--duration) var(--ease-out); }
    .feedback-submit:hover { background-color: var(--teal-dim); }
    .feedback-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback-success { display: none; background-color: var(--teal-bg); border: 1px solid var(--teal-border); color: var(--teal); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); margin-top: var(--space-3); }
    .feedback-success.visible { display: block; }
    @media (max-width: 599px) { .feedback-box { padding: var(--space-4); } }
    @media print { .feedback-box { display: none; } }

    /* General Notes Banner */
    .general-notes-banner {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-6);
    }
    .general-notes-banner .gn-title {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-3);
    }
    .general-notes-banner ol {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: gn-step;
    }
    .general-notes-banner ol li {
      position: relative;
      padding-left: var(--space-6);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-2);
      max-width: none;
      counter-increment: gn-step;
    }
    .general-notes-banner ol li:last-child { margin-bottom: 0; }
    .general-notes-banner ol li::before {
      content: counter(gn-step) ".";
      position: absolute;
      left: var(--space-2);
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Clinical Considerations */
    .clinical-considerations {
      margin-top: var(--space-4);
      border-top: 1px solid var(--border);
      padding-top: var(--space-4);
    }
    .cc-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      transition: color var(--duration) var(--ease-out);
    }
    .cc-toggle:hover { color: var(--text); }
    .cc-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform var(--duration) var(--ease-out);
    }
    .clinical-considerations.cc-expanded .cc-toggle svg {
      transform: rotate(180deg);
    }
    .cc-body {
      display: none;
      padding-top: var(--space-3);
    }
    .clinical-considerations.cc-expanded .cc-body {
      display: block;
    }
    .cc-section {
      margin-bottom: var(--space-4);
    }
    .cc-section:last-child { margin-bottom: 0; }
    .cc-section-title {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-2);
    }
    .cc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .cc-list > li {
      position: relative;
      padding-left: var(--space-4);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-1);
      max-width: none;
    }
    .cc-list > li::before {
      content: "";
      position: absolute;
      left: var(--space-2);
      top: 0.65em;
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
      background-color: var(--text-muted);
      opacity: 0.5;
    }
    .cc-list .cc-sub {
      list-style: none;
      padding: 0;
      margin: var(--space-1) 0 var(--space-1) var(--space-4);
    }
    .cc-list .cc-sub li {
      position: relative;
      padding-left: var(--space-4);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-1);
      max-width: none;
    }
    .cc-list .cc-sub li::before {
      content: "–";
      position: absolute;
      left: var(--space-1);
      color: var(--text-muted);
      opacity: 0.5;
    }
    .cc-note {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-style: italic;
      margin-top: var(--space-2);
      padding-left: var(--space-3);
      border-left: 2px solid var(--border);
    }
  </style>
</head>
<body>
<button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script>
    (function() {
      'use strict';

      // ============================
      // 1. Theme Toggle
      // ============================
      const html = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const iconSun = toggle.querySelector('.icon-sun');
      const iconMoon = toggle.querySelector('.icon-moon');

      function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        // Theme stored in memory only
        if (theme === 'dark') {
          iconSun.style.display = '';
          iconMoon.style.display = 'none';
        } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = '';
        }
      }

      // Detect system preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        setTheme('light');
      } else {
        setTheme('dark');
      }

      toggle.addEventListener('click', function() {
        const current = html.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });


      // ============================
      // 2. Protocol Card Expand/Collapse
      // ============================
      const protocolCards = document.querySelectorAll('.protocol-card');

      protocolCards.forEach(function(card) {
        const header = card.querySelector('.protocol-header');
        if (!header) return;

        header.addEventListener('click', function() {
          const isExpanded = card.classList.contains('expanded');
          card.classList.toggle('expanded');
          header.setAttribute('aria-expanded', !isExpanded);
        });

        header.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            header.click();
          }
        });
      });


      // ============================
      // 3. Full-Text Search with Debounce
      // ============================
      const searchInput = document.getElementById('searchInput');
      const searchCount = document.getElementById('searchCount');
      const searchables = document.querySelectorAll('[data-searchable]');
      let searchTimeout;

      function performSearch() {
        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
          // Reset all
          searchables.forEach(function(el) {
            el.classList.remove('search-no-match');
          });
          searchCount.textContent = '';
          searchCount.classList.remove('has-results');
          return;
        }

        let matchCount = 0;

        searchables.forEach(function(el) {
          // Search in data-searchable attribute + all inner text
          const searchData = (el.getAttribute('data-searchable') || '') + ' ' + el.textContent;
          const isMatch = searchData.toLowerCase().indexOf(query) !== -1;

          if (isMatch) {
            el.classList.remove('search-no-match');
            matchCount++;
          } else {
            el.classList.add('search-no-match');
          }
        });

        searchCount.textContent = matchCount + ' of ' + searchables.length;
        searchCount.classList.toggle('has-results', matchCount > 0);
      }

      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 200);
      });


      // ============================
      // 4. Back to Top (rAF-throttled)
      // ============================
      const backBtn = document.getElementById('backToTop');
      let ticking = false;

      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(function() {
            if (window.scrollY > 300) {
              backBtn.classList.add('visible');
            } else {
              backBtn.classList.remove('visible');
            }
            ticking = false;
          });
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      backBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });


      // ============================
      // 5. SmartPhrase Copy
      // ============================
      document.querySelectorAll('.sp').forEach(function(chip) {
        chip.addEventListener('click', function() {
          const text = chip.textContent.replace(/^\./, '');
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('.' + text).then(function() {
              chip.style.outline = '2px solid var(--teal)';
              setTimeout(function() { chip.style.outline = ''; }, 600);
            });
          }
        });
      });

      // Feedback form — handled by feedback-submit.js

    })();
  </script>
  <script src="feedback-submit.js"></script>
</body>
</html>
