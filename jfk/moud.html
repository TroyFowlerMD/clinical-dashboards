<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOUD Prescriber Guide — JFK ADATC</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    /* Page-specific styles for MOUD prescriber guide */

    /* Search match count badge */
    .search-count {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }
    .search-count.has-results {
      color: var(--teal);
    }

    /* Section divider */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: var(--space-8) 0;
    }

    /* Content bullets inside protocol bodies */
    .protocol-body ul {
      list-style: none;
      padding: 0;
      margin: var(--space-3) 0;
    }

    .protocol-body ul li {
      position: relative;
      padding-left: var(--space-5);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-2);
      max-width: none;
    }

    .protocol-body ul li::before {
      content: "";
      position: absolute;
      left: var(--space-2);
      top: 0.65em;
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
      background-color: var(--teal);
      opacity: 0.6;
    }

    /* Nested list */
    .protocol-body ul ul {
      margin: var(--space-1) 0 var(--space-2) 0;
    }

    .protocol-body ul ul li::before {
      background-color: var(--text-muted);
      width: 3px;
      height: 3px;
    }

    /* Ordered list inside protocol body */
    .protocol-body ol {
      padding-left: var(--space-6);
      margin: var(--space-3) 0;
    }

    .protocol-body ol li {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-2);
      max-width: none;
      padding-left: var(--space-1);
    }

    .protocol-body ol li::marker {
      color: var(--teal);
      font-weight: 600;
    }

    /* Body paragraph */
    .protocol-body p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-3);
      max-width: none;
    }

    .protocol-body p:last-child {
      margin-bottom: 0;
    }

    .protocol-body strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Dosing guidance label */
    .dosing-label {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
      margin-top: var(--space-4);
    }

    /* Protocol note — italic aside */
    .protocol-note {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-style: italic;
      margin-top: var(--space-3);
      margin-bottom: var(--space-3);
      padding-left: var(--space-3);
      border-left: 2px solid var(--border);
    }

    /* Warning/info banner text overrides for readability */
    .warning-banner p,
    .info-banner p {
      margin-bottom: 0;
    }

    .warning-banner ul,
    .info-banner ul {
      margin: var(--space-2) 0 0 0;
    }

    .warning-banner ul li,
    .info-banner ul li {
      color: inherit;
    }

    .warning-banner ul li::before,
    .info-banner ul li::before {
      background-color: currentColor;
      opacity: 0.4;
    }

    /* Table wrapper for mobile scroll */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: var(--space-4);
    }

    /* Feedback box */
    .feedback-box { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); margin-top: var(--space-10); }
    .feedback-box h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--text); margin-bottom: var(--space-4); }
    .feedback-form { display: flex; flex-direction: column; gap: var(--space-4); }
    .feedback-field { display: flex; flex-direction: column; gap: var(--space-2); }
    .feedback-field label { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; color: var(--text); }
    .feedback-field input, .feedback-field textarea { background-color: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); color: var(--text); font-family: var(--font-body); transition: border-color var(--duration) var(--ease-out), box-shadow var(--duration) var(--ease-out); resize: vertical; }
    .feedback-field input::placeholder, .feedback-field textarea::placeholder { color: var(--text-muted); }
    .feedback-field input:focus, .feedback-field textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-bg); }
    .feedback-field textarea { min-height: 100px; }
    .feedback-submit { display: inline-flex; align-items: center; gap: var(--space-2); background-color: var(--teal); color: var(--bg); font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; padding: var(--space-2) var(--space-5); border-radius: var(--radius-md); border: none; cursor: pointer; align-self: flex-start; transition: background-color var(--duration) var(--ease-out), opacity var(--duration) var(--ease-out); }
    .feedback-submit:hover { background-color: var(--teal-dim); }
    .feedback-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback-success { display: none; background-color: var(--teal-bg); border: 1px solid var(--teal-border); color: var(--teal); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); margin-top: var(--space-3); }
    .feedback-success.visible { display: block; }
    @media (max-width: 599px) { .feedback-box { padding: var(--space-4); } }
    @media print { .feedback-box { display: none; } }
  </style>
</head>
<body>
<button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>


  <script>
    (function() {
      'use strict';

      // ============================
      // 1. Theme Toggle
      // ============================
      const html = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const iconSun = toggle.querySelector('.icon-sun');
      const iconMoon = toggle.querySelector('.icon-moon');

      function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        // Theme stored in memory only
        if (theme === 'dark') {
          iconSun.style.display = '';
          iconMoon.style.display = 'none';
        } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = '';
        }
      }

      // Detect system preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        setTheme('light');
      } else {
        setTheme('dark');
      }

      toggle.addEventListener('click', function() {
        var current = html.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });


      // ============================
      // 2. Protocol Card Expand/Collapse
      // ============================
      var protocolCards = document.querySelectorAll('.protocol-card');

      protocolCards.forEach(function(card) {
        var header = card.querySelector('.protocol-header');
        if (!header) return;

        header.addEventListener('click', function() {
          var isExpanded = card.classList.contains('expanded');
          card.classList.toggle('expanded');
          header.setAttribute('aria-expanded', !isExpanded);
        });

        header.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            header.click();
          }
        });
      });


      // ============================
      // 3. Full-Text Search with Debounce
      // ============================
      var searchInput = document.getElementById('searchInput');
      var searchCount = document.getElementById('searchCount');
      var searchables = document.querySelectorAll('[data-searchable]');
      var searchTimeout;

      function performSearch() {
        var query = searchInput.value.trim().toLowerCase();

        if (!query) {
          searchables.forEach(function(el) {
            el.classList.remove('search-no-match');
          });
          searchCount.textContent = '';
          searchCount.classList.remove('has-results');
          return;
        }

        var matchCount = 0;

        searchables.forEach(function(el) {
          var searchData = (el.getAttribute('data-searchable') || '') + ' ' + el.textContent;
          var isMatch = searchData.toLowerCase().indexOf(query) !== -1;

          if (isMatch) {
            el.classList.remove('search-no-match');
            matchCount++;
          } else {
            el.classList.add('search-no-match');
          }
        });

        searchCount.textContent = matchCount + ' of ' + searchables.length;
        searchCount.classList.toggle('has-results', matchCount > 0);
      }

      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 200);
      });


      // ============================
      // 4. Back to Top (rAF-throttled, passive)
      // ============================
      var backBtn = document.getElementById('backToTop');
      var ticking = false;

      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(function() {
            if (window.scrollY > 300) {
              backBtn.classList.add('visible');
            } else {
              backBtn.classList.remove('visible');
            }
            ticking = false;
          });
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      backBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Feedback form — handled by feedback-submit.js

    })();
  </script>
  <script src="feedback-submit.js"></script>
</body>
</html>
