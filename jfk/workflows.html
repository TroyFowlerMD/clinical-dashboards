<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psychiatry Epic Workflows — JFK ADATC</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    /* Page-specific styles for workflows */

    /* Search match count badge */
    .search-count {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }
    .search-count.has-results {
      color: var(--teal);
    }

    /* Workflow body content styling */
    .workflow-phase-body-inner h4 {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: var(--space-5);
      margin-bottom: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border);
    }
    .workflow-phase-body-inner h4:first-child {
      margin-top: 0;
    }

    .workflow-phase-body-inner > ul {
      list-style: none;
      padding: 0;
      margin: 0 0 var(--space-4) 0;
    }

    .workflow-phase-body-inner > ul > li {
      position: relative;
      padding: var(--space-2) 0 var(--space-2) var(--space-5);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: none;
    }

    .workflow-phase-body-inner > ul > li::before {
      content: "";
      position: absolute;
      left: var(--space-2);
      top: 0.85em;
      width: 5px;
      height: 5px;
      border-radius: var(--radius-full);
      background-color: var(--teal);
      opacity: 0.5;
    }

    .workflow-phase-body-inner > ul > li strong {
      color: var(--text);
      font-weight: 600;
    }

    .workflow-phase-body-inner p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-3);
      max-width: none;
    }

    .workflow-phase-body-inner p strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Nested list inside plain bullets */
    .workflow-phase-body-inner > ul ul {
      list-style: none;
      margin: var(--space-2) 0 var(--space-2) var(--space-3);
      padding: 0;
    }

    .workflow-phase-body-inner > ul ul li {
      position: relative;
      padding: var(--space-1) 0 var(--space-1) var(--space-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: none;
    }

    .workflow-phase-body-inner > ul ul li::before {
      content: "";
      position: absolute;
      left: var(--space-2);
      top: 0.75em;
      background-color: var(--text-muted);
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
    }

    .workflow-phase-body-inner > ul ul li strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Priority note at top of admission */
    .priority-note {
      background-color: var(--teal-bg);
      border: 1px solid var(--teal-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-5);
      font-size: var(--text-sm);
      color: var(--teal);
      line-height: 1.6;
    }

    /* ================================================================
       NESTED COLLAPSIBLE ITEMS (level 2 — items with checkboxes)
       ================================================================ */

    /* Container for each collapsible item */
    .wf-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2);
      background-color: var(--surface-2);
      overflow: hidden;
    }

    /* Item header row: checkbox + title + chevron */
    .wf-item-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      cursor: pointer;
      user-select: none;
      transition: background-color var(--duration) var(--ease-out);
    }

    .wf-item-header:hover {
      background-color: var(--surface-3);
    }

    /* Custom checkbox for wf-item */
    .wf-item-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color var(--duration) var(--ease-out),
                  background-color var(--duration) var(--ease-out);
    }

    .wf-item-checkbox:hover {
      border-color: var(--teal);
    }

    .wf-item-checkbox:checked {
      background-color: var(--teal);
      border-color: var(--teal);
    }

    .wf-item-checkbox:checked::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 4px;
      width: 5px;
      height: 9px;
      border: solid var(--bg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .wf-item-checkbox:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    /* Item title text */
    .wf-item-title {
      flex: 1;
      min-width: 0;
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    /* Checked state: strike-through on title */
    .wf-item.is-checked .wf-item-title {
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
      color: var(--text-muted);
    }

    .wf-item.is-checked .wf-item-header {
      opacity: 0.6;
    }

    /* Item chevron */
    .wf-item-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform var(--duration) var(--ease-out),
                  color var(--duration) var(--ease-out);
    }

    .wf-item.expanded .wf-item-chevron {
      transform: rotate(180deg);
      color: var(--teal);
    }

    /* Item body — hidden by default */
    .wf-item-body {
      display: none;
      padding: var(--space-2) var(--space-3) var(--space-3) calc(var(--space-3) + 17px + var(--space-3));
      border-top: 1px solid var(--border);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .wf-item.expanded .wf-item-body {
      display: block;
    }

    .wf-item-body ul {
      list-style: none;
      padding: 0;
      margin: var(--space-2) 0 0 0;
    }

    .wf-item-body ul li {
      position: relative;
      padding: var(--space-1) 0 var(--space-1) var(--space-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: none;
    }

    .wf-item-body ul li::before {
      content: "";
      position: absolute;
      left: var(--space-1);
      top: 0.75em;
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
      background-color: var(--teal);
      opacity: 0.5;
    }

    .wf-item-body ul li strong {
      color: var(--text);
      font-weight: 600;
    }

    .wf-item-body ul ul {
      margin: var(--space-1) 0 var(--space-1) var(--space-3);
    }

    .wf-item-body ul ul li::before {
      background-color: var(--text-muted);
    }

    .wf-item-body p {
      margin-bottom: var(--space-2);
      max-width: none;
    }

    .wf-item-body p:last-child {
      margin-bottom: 0;
    }

    .wf-item-body strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Category group header (h4 within nested structure) */
    .wf-category {
      margin-top: var(--space-5);
      margin-bottom: var(--space-3);
    }

    .wf-category:first-child {
      margin-top: 0;
    }

    /* Collapsible category (no checkbox, just toggle content) */
    .wf-category.collapsible .wf-category-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wf-category.collapsible .wf-category-header:hover {
      color: var(--text);
    }

    .wf-category.collapsible .wf-category-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform var(--duration) var(--ease-out),
                  color var(--duration) var(--ease-out);
    }

    .wf-category.collapsible.expanded .wf-category-chevron {
      transform: rotate(180deg);
      color: var(--teal);
    }

    .wf-category.collapsible .wf-category-body {
      display: none;
    }

    .wf-category.collapsible.expanded .wf-category-body {
      display: block;
    }

    .wf-category-header {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-3);
    }

    /* SmartPhrase copy toast */
    .sp-toast {
      position: fixed;
      bottom: var(--space-8);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--surface-2);
      border: 1px solid var(--teal-border);
      color: var(--teal);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms var(--ease-out),
                  transform 200ms var(--ease-out);
    }
    .sp-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Warning banner within workflow body with list support */
    .workflow-phase-body-inner .warning-banner {
      margin-top: var(--space-4);
    }
    .warning-banner ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .warning-banner ul li {
      padding: var(--space-1) 0;
      color: var(--amber);
      font-size: var(--text-sm);
      line-height: 1.5;
      max-width: none;
    }
    .warning-banner ul li::before {
      display: none;
    }
    .warning-banner ul li strong {
      color: var(--amber);
      font-weight: 700;
    }

    /* Use/Do Not Use lists in Significant Event */
    .use-list li::before {
      background-color: var(--teal) !important;
      opacity: 0.8 !important;
    }
    .do-not-use-list li::before {
      background-color: var(--red) !important;
      opacity: 0.8 !important;
    }

    /* ================================================================
       FEEDBACK BOX
       ================================================================ */
    /* Red text for Federal requirement warnings */
    .text-red {
      color: var(--red, #f87171) !important;
    }

    .feedback-box {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-top: var(--space-10);
    }

    .feedback-box h2 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-4);
    }

    .feedback-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .feedback-field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .feedback-field label {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text);
    }

    .feedback-field input,
    .feedback-field textarea {
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--text-sm);
      color: var(--text);
      font-family: var(--font-body);
      transition: border-color var(--duration) var(--ease-out),
                  box-shadow var(--duration) var(--ease-out);
      resize: vertical;
    }

    .feedback-field input::placeholder,
    .feedback-field textarea::placeholder {
      color: var(--text-muted);
    }

    .feedback-field input:focus,
    .feedback-field textarea:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-bg);
    }

    .feedback-field textarea {
      min-height: 100px;
    }

    .feedback-submit {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      background-color: var(--teal);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color var(--duration) var(--ease-out),
                  opacity var(--duration) var(--ease-out);
    }

    .feedback-submit:hover {
      background-color: var(--teal-dim);
    }

    .feedback-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .feedback-success {
      display: none;
      background-color: var(--teal-bg);
      border: 1px solid var(--teal-border);
      color: var(--teal);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      margin-top: var(--space-3);
    }

    .feedback-success.visible {
      display: block;
    }

    /* Mobile adjustments */
    @media (max-width: 599px) {
      .feedback-box {
        padding: var(--space-4);
      }
    }

    /* Print: show all wf-item bodies */
    @media print {
      .wf-item-body {
        display: block !important;
      }
      .wf-item-chevron {
        display: none;
      }
      .feedback-box {
        display: none;
      }
    }
  </style>
</head>
<body>
<button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- SmartPhrase copy toast -->
  <div class="sp-toast" id="spToast" aria-live="polite"></div>

  <script>
    /* ================================================================
       THEME TOGGLE
       ================================================================ */
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const iconSun = themeToggle.querySelector('.icon-sun');
    const iconMoon = themeToggle.querySelector('.icon-moon');

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        iconSun.style.display = '';
        iconMoon.style.display = 'none';
      } else {
        iconSun.style.display = 'none';
        iconMoon.style.display = '';
      }
    }

    // Init theme (always start dark per default)
    applyTheme(html.getAttribute('data-theme') || 'dark');

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    /* ================================================================
       COLLAPSIBLE CATEGORY TOGGLE (no checkbox, just expand/collapse)
       ================================================================ */
    function toggleCategory(header) {
      const cat = header.closest('.wf-category');
      cat.classList.toggle('expanded');
    }

    /* ================================================================
       WORKFLOW PHASE TOGGLE (top-level accordion)
       ================================================================ */
    function togglePhase(header) {
      const phase = header.closest('.workflow-phase');
      phase.classList.toggle('expanded');
    }

    /* ================================================================
       NESTED ITEM TOGGLE (level-2 collapsible)
       ================================================================ */
    function toggleItem(header) {
      const item = header.closest('.wf-item');
      item.classList.toggle('expanded');
    }

    /* ================================================================
       CHECKBOX TOGGLE (mark item complete)
       ================================================================ */
    function toggleCheck(event, checkbox) {
      // Stop the click from also triggering toggleItem
      event.stopPropagation();
      const item = checkbox.closest('.wf-item');
      if (checkbox.checked) {
        item.classList.add('is-checked');
      } else {
        item.classList.remove('is-checked');
      }
    }

    /* ================================================================
       SMARTPHRASE COPY
       ================================================================ */
    const spToast = document.getElementById('spToast');
    let toastTimer = null;

    function copySP(el) {
      // Get raw text content (no prefix stripping needed — no sp: prefixes)
      const text = el.textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        spToast.textContent = 'Copied: ' + text;
        spToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => spToast.classList.remove('show'), 2000);
      }).catch(() => {
        // Fallback
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
    }

    /* ================================================================
       BACK TO TOP
       ================================================================ */
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backToTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ================================================================
       SEARCH
       ================================================================ */
    const searchInput = document.getElementById('searchInput');
    const searchCountEl = document.getElementById('searchCount');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      const phases = document.querySelectorAll('.workflow-phase[data-searchable]');

      if (!query) {
        phases.forEach(p => {
          p.classList.remove('search-no-match');
          // Collapse all wf-items back to default when search cleared
        });
        searchCountEl.textContent = '';
        searchCountEl.classList.remove('has-results');
        return;
      }

      let matchCount = 0;

      phases.forEach(phase => {
        const phaseText = phase.textContent.toLowerCase();
        if (phaseText.includes(query)) {
          phase.classList.remove('search-no-match');
          // Auto-expand phase if it matches
          phase.classList.add('expanded');
          matchCount++;

          // Also expand matching wf-items
          phase.querySelectorAll('.wf-item').forEach(item => {
            const itemText = item.textContent.toLowerCase();
            if (itemText.includes(query)) {
              item.classList.add('expanded');
            }
          });
        } else {
          phase.classList.add('search-no-match');
        }
      });

      if (matchCount > 0) {
        searchCountEl.textContent = matchCount + ' section' + (matchCount === 1 ? '' : 's');
        searchCountEl.classList.add('has-results');
      } else {
        searchCountEl.textContent = 'No results';
        searchCountEl.classList.remove('has-results');
      }
    });

    /* Feedback form — handled by feedback-submit.js */
  </script>
  <script src="feedback-submit.js"></script>
</body>
</html>
