name: JFK PWA cache guard

on:
  pull_request:
    paths:
      - 'jfk/**'
      - 'scripts/check-jfk-pwa-cache.mjs'
      - '.github/workflows/jfk-pwa-cache-guard.yml'
  push:
    branches: [main]
    paths:
      - 'jfk/**'
      - 'scripts/check-jfk-pwa-cache.mjs'
      - '.github/workflows/jfk-pwa-cache-guard.yml'

permissions:
  contents: read

jobs:
  cache-guard:
    name: JFK PWA cache guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify online refresh and offline fallback
        run: node scripts/check-jfk-pwa-cache.mjs
